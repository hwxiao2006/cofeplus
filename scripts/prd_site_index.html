<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>COFE+ PRD</title>
    <style>
        :root {
            color-scheme: light;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
            color: #17202a;
            background: #f6f7f8;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 48px 24px 80px;
        }
        main {
            width: min(820px, 100%);
        }
        h1 {
            margin: 0 0 8px;
            font-size: 32px;
            line-height: 1.2;
        }
        .lead {
            margin: 0 0 32px;
            color: #5b6670;
            font-size: 16px;
            line-height: 1.7;
        }
        section {
            margin-bottom: 28px;
        }
        h2 {
            margin: 0 0 12px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #475467;
        }
        .links {
            display: grid;
            gap: 10px;
        }
        a {
            display: flex;
            align-items: center;
            min-height: 52px;
            padding: 10px 18px;
            border-radius: 10px;
            background: #fff;
            border: 1px solid #d7dde6;
            color: #0f172a;
            text-decoration: none;
            font-weight: 600;
            transition: border-color .15s, transform .05s;
        }
        a:hover {
            border-color: #0b6bcb;
        }
        a:active {
            transform: translateY(1px);
        }
        a .desc {
            margin-left: 10px;
            color: #6b7280;
            font-weight: 400;
            font-size: 13px;
        }
        a.primary {
            background: #0b6bcb;
            color: #fff;
            border-color: #0b6bcb;
        }
        a.primary .desc { color: #d9e7f7; }
        a.secondary {
            background: #109c93;
            color: #fff;
            border-color: #109c93;
        }
        a.secondary .desc { color: #d2eeec; }
        @media (max-width: 480px) {
            body { padding: 28px 16px 60px; }
            h1 { font-size: 26px; }
        }
    </style>
</head>
<body>
    <main>
        <h1>COFE+ PRD</h1>
        <p class="lead">这里是独立的产品需求文档站点，和运营后台原型页面分开部署。按模块分组列出当前可查看的 PRD。</p>

        <section>
            <h2>核心模块</h2>
            <div class="links">
                <a href="/tasks/prd-staff-management-user-flow.html" class="secondary">
                    <span>人员管理用户流程 PRD</span>
                </a>
                <a href="/tasks/prd-product-management-user-flow.html" class="primary">
                    <span>商品管理用户流程 PRD</span>
                </a>
                <a href="/tasks/prd-device-management-user-flow.html">
                    <span>设备管理用户流程 PRD</span>
                </a>
                <a href="/tasks/prd-orders-management-user-flow.html">
                    <span>订单管理用户流程 PRD</span>
                </a>
                <a href="/tasks/prd-materials-management-user-flow.html">
                    <span>物料管理用户流程 PRD</span>
                </a>
            </div>
        </section>

        <section>
            <h2>配方 / 标签 / 选项</h2>
            <div class="links">
                <a href="/tasks/prd-recipe-management-main-editor.html">
                    <span>配方管理 PRD</span>
                    <span class="desc">选项驱动获取配方</span>
                </a>
                <a href="/tasks/prd-product-option-display-status.html">
                    <span>商品选项点单屏展示状态 PRD</span>
                    <span class="desc">隐藏 / 不可用 · 标签双热区</span>
                </a>
                <a href="/tasks/prd-product-detail-recipe-tag-config.html">
                    <span>商品详情配方与标签配置 PRD</span>
                    <span class="desc">历史版本 · 旧弹窗交互</span>
                </a>
                <a href="/tasks/prd-menu-management-business-tag-management.html">
                    <span>业务标签管理 PRD</span>
                </a>
                <a href="/tasks/prd-menu-management-tag-imprint-settings.html">
                    <span>菜单印花 / 标签设置 PRD</span>
                </a>
                <a href="/tasks/prd-menu-management-imprint-image-settings.html">
                    <span>印花图片设置 PRD</span>
                </a>
                <a href="/tasks/prd-copy-product-flow.html">
                    <span>复制商品流程 PRD</span>
                </a>
            </div>
        </section>
    </main>
</body>
</html>
