<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
    <rect width="1440" height="960" fill="#edf2f7"/>
    <rect x="80" y="56" width="1280" height="848" rx="26" fill="#ffffff" stroke="#d7e2ee"/>
    <rect x="80" y="56" width="1280" height="92" rx="26" fill="#f8fbfd"/>
    <text x="122" y="112" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="start">UF-004 通过角色模板快速分配权限</text>
    <text x="122" y="138" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="500" fill="#667085" text-anchor="start">新建员工时先选择角色模板，点卡片只进入待确认状态，确认后才覆盖权限树。</text>
    <line x1="80" y1="148" x2="1360" y2="148" stroke="#d7e2ee"/>
    <text x="122" y="202" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="800" fill="#172033" text-anchor="start">添加员工</text><text x="122" y="232" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="500" fill="#667085" text-anchor="start">基础信息完成后，进入“选择角色”区域。</text>
  <rect x="1048" y="198" width="190" height="30" rx="15" fill="#f8fbfd" stroke="#d7e2ee"/><text x="1143" y="218" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700" fill="#475467" text-anchor="middle">已选权限 0 项</text>
  <text x="122" y="292" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="800" fill="#172033" text-anchor="start">选择角色</text><text x="122" y="320" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="500" fill="#667085" text-anchor="start">角色模板会作为权限默认值，仍可在下方继续微调。</text>
  <g>
    <rect x="122" y="350" width="285" height="140" rx="14" fill="#ffffff" stroke="#d7e2ee" stroke-width="2"/>
    <circle cx="154" cy="384" r="18" fill="#fee2e2"/>
    <text x="154" y="391" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="800" fill="#b91c1c" text-anchor="middle">超</text>
    <text x="184" y="382" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="800" fill="#172033" text-anchor="start">超级管理员</text>
    <text x="184" y="408" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="500" fill="#667085" text-anchor="start">商户后台最高权限</text>
    <text x="142" y="452" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="600" fill="#475467" text-anchor="start">默认：全部页面 + 全部设备</text>
    
  </g>
  <g>
    <rect x="427" y="350" width="285" height="140" rx="14" fill="#fff7ed" stroke="#d97706" stroke-width="2" stroke-dasharray="7 6"/>
    <circle cx="459" cy="384" r="18" fill="#dcfce7"/>
    <text x="459" y="391" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="800" fill="#15803d" text-anchor="middle">店</text>
    <text x="489" y="382" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="800" fill="#172033" text-anchor="start">店长</text>
    <text x="489" y="408" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="500" fill="#667085" text-anchor="start">门店日常运营</text>
    <text x="447" y="452" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="600" fill="#475467" text-anchor="start">默认：订单 / 物料 / 退款</text>
    <rect x="634" y="362" width="62" height="24" rx="12" fill="#fef3c7" stroke="#fbbf24"/><text x="665" y="379" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">待确认</text>
  </g>
  <g>
    <rect x="732" y="350" width="285" height="140" rx="14" fill="#ffffff" stroke="#d7e2ee" stroke-width="2"/>
    <circle cx="764" cy="384" r="18" fill="#dbeafe"/>
    <text x="764" y="391" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="800" fill="#1d4ed8" text-anchor="middle">维</text>
    <text x="794" y="382" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="800" fill="#172033" text-anchor="start">运维人员</text>
    <text x="794" y="408" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="500" fill="#667085" text-anchor="start">设备安装与故障处理</text>
    <text x="752" y="452" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="600" fill="#475467" text-anchor="start">默认：设备 / 故障 / 物料</text>
    
  </g>
  <g>
    <rect x="1037" y="350" width="285" height="140" rx="14" fill="#ffffff" stroke="#d7e2ee" stroke-width="2"/>
    <circle cx="1069" cy="384" r="18" fill="#f3e8ff"/>
    <text x="1069" y="391" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="800" fill="#7e22ce" text-anchor="middle">职</text>
    <text x="1099" y="382" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="800" fill="#172033" text-anchor="start">职员</text>
    <text x="1099" y="408" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="500" fill="#667085" text-anchor="start">基础查看权限</text>
    <text x="1057" y="452" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="600" fill="#475467" text-anchor="start">默认：总览 / 商品 / 订单查看</text>
    
  </g>
  <rect x="122" y="530" width="1200" height="88" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="154" y="566" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="800" fill="#9a3412" text-anchor="start">自定义 -&gt; 店长</text>
  <text x="154" y="594" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="600" fill="#9a3412" text-anchor="start">保留 0 项 · 新增 12 项 · 移除 0 项。点击确认前，权限树不会被覆盖。</text>
  <rect x="1008" y="552" width="132" height="42" rx="8" fill="#109c93"/><text x="1074" y="579" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">确认切换</text>
  <rect x="1154" y="552" width="132" height="42" rx="8" fill="#fff" stroke="#d7e2ee"/><text x="1220" y="579" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="800" fill="#475467" text-anchor="middle">取消</text>
  <rect x="122" y="660" width="1200" height="150" rx="18" fill="#f8fbfd" stroke="#d7e2ee"/>
  <text x="154" y="700" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="800" fill="#172033" text-anchor="start">权限树预览</text><text x="154" y="730" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="500" fill="#667085" text-anchor="start">当前仍保持手动自定义状态，确认角色后再批量勾选。</text>
  <rect x="154" y="760" width="100" height="30" rx="15" fill="#fff" stroke="#d7e2ee"/><text x="204" y="780" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700" fill="#667085" text-anchor="middle">总览 0/1</text><rect x="270" y="760" width="120" height="30" rx="15" fill="#fff" stroke="#d7e2ee"/><text x="330" y="780" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700" fill="#667085" text-anchor="middle">订单 0/2</text><rect x="406" y="760" width="160" height="30" rx="15" fill="#fff" stroke="#d7e2ee"/><text x="486" y="780" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700" fill="#667085" text-anchor="middle">人员管理 0/2</text>
  </svg>