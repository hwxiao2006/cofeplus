<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
    <rect width="1440" height="960" fill="#edf2f7"/>
    <rect x="80" y="56" width="1280" height="848" rx="26" fill="#ffffff" stroke="#d7e2ee"/>
    <rect x="80" y="56" width="1280" height="92" rx="26" fill="#f8fbfd"/>
    <text x="122" y="112" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="start">UF-007 撤销刚刚的角色切换</text>
    <text x="122" y="138" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="500" fill="#667085" text-anchor="start">确认切换后出现一次性撤销入口；只要继续手动改权限，撤销立即失效。</text>
    <line x1="80" y1="148" x2="1360" y2="148" stroke="#d7e2ee"/>
    <rect x="122" y="210" width="1200" height="70" rx="16" fill="#ecfdf5" stroke="#99f6e4"/>
  <text x="154" y="253" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="800" fill="#047857" text-anchor="start">当前角色：店长</text>
  <rect x="1140" y="224" width="150" height="42" rx="8" fill="#ffffff" stroke="#109c93"/><text x="1215" y="251" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="800" fill="#047857" text-anchor="middle">撤销切换</text>
  <rect x="122" y="330" width="1200" height="108" rx="16" fill="#f8fbfd" stroke="#d7e2ee"/>
  <text x="154" y="370" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="800" fill="#172033" text-anchor="start">切换前状态已保留</text><text x="154" y="402" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="600" fill="#475467" text-anchor="start">可回滚：角色、权限选中、模块设备范围。</text>
  <path d="M328 506 H1112" stroke="#d7e2ee" stroke-width="4" stroke-linecap="round"/>
  <circle cx="328" cy="506" r="28" fill="#ecfdf5" stroke="#109c93" stroke-width="3"/><text x="328" y="513" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="800" fill="#047857" text-anchor="middle">1</text><text x="260" y="562" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="800" fill="#172033" text-anchor="start">确认切换</text>
  <circle cx="720" cy="506" r="28" fill="#ecfdf5" stroke="#109c93" stroke-width="3"/><text x="720" y="513" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="800" fill="#047857" text-anchor="middle">2</text><text x="636" y="562" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="800" fill="#172033" text-anchor="start">显示撤销按钮</text>
  <circle cx="1112" cy="506" r="28" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/><text x="1112" y="513" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="800" fill="#92400e" text-anchor="middle">3</text><text x="1014" y="562" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="800" fill="#172033" text-anchor="start">手动改权限后隐藏</text>
  <rect x="122" y="638" width="1200" height="110" rx="16" fill="#fff7ed" stroke="#fed7aa"/><text x="154" y="678" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="800" fill="#9a3412" text-anchor="start">撤销规则</text><text x="154" y="710" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="600" fill="#9a3412" text-anchor="start">撤销按钮只挂在“当前角色”条右侧，不使用独立 toast；打开新增或编辑弹窗时必须隐藏。</text>
  </svg>
