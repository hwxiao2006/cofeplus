    <text x="122" y="138" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="500" fill="#667085" text-anchor="start">打开编辑弹窗时只回填状态，不出现“切换成功”或撤销按钮。</text>
