<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
    <rect width="1440" height="1000" fill="#edf2f7"/>
    <rect x="80" y="56" width="1280" height="888" rx="26" fill="#ffffff" stroke="#d7e2ee"/>
    <rect x="80" y="56" width="1280" height="92" rx="26" fill="#f8fbfd"/>
    <text x="122" y="112" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="start">UF-013 超级管理员跨商户新增人员</text>
    <text x="122" y="138" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="500" fill="#667085" text-anchor="start">仅超级管理员可指定目标商户或选择平台级，并能从更大范围的角色中选择。</text>
    <line x1="80" y1="148" x2="1360" y2="148" stroke="#d7e2ee"/>

    <text x="122" y="202" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="800" fill="#172033" text-anchor="start">基本信息</text>
    <text x="1252" y="196" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="900" fill="#ef4444" text-anchor="end">*</text>

    <!-- 所属商户选择器（仅超管可见） -->
    <text x="122" y="240" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#374151" text-anchor="start">所属商户</text>
    <rect x="122" y="252" width="560" height="38" rx="8" fill="#ffffff" stroke="#109c93" stroke-width="2"/>
    <text x="142" y="276" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="600" fill="#172033" text-anchor="start">平台级（不绑定商户）</text>
    <text x="654" y="278" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#667085" text-anchor="end">⌄</text>
    <text x="122" y="308" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="500" fill="#9ca3af" text-anchor="start">超级管理员可为指定商户创建人员；选择「平台级」则创建不绑定商户的平台角色</text>

    <text x="722" y="240" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#374151" text-anchor="start">用户名</text>
    <rect x="722" y="252" width="280" height="38" rx="8" fill="#ffffff" stroke="#d7e2ee"/>
    <text x="742" y="276" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#9ca3af" text-anchor="start">请输入名称</text>

    <text x="1022" y="240" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#374151" text-anchor="start">手机号</text>
    <rect x="1022" y="252" width="216" height="38" rx="8" fill="#ffffff" stroke="#d7e2ee"/>
    <text x="1042" y="276" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#9ca3af" text-anchor="start">请输入手机号</text>

    <line x1="122" y1="336" x2="1318" y2="336" stroke="#d7e2ee"/>

    <text x="122" y="380" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="800" fill="#172033" text-anchor="start">选择角色</text>
    <text x="122" y="406" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="500" fill="#667085" text-anchor="start">超级管理员可创建以下角色，其中平台运维、商户管理员仅超级管理员可授予。</text>

    <!-- 5 张角色卡：平台运维 / 商户管理员 / 店长 / 运维人员 / 职员 -->
    <g>
      <rect x="122" y="436" width="222" height="150" rx="14" fill="#ffffff" stroke="#d7e2ee" stroke-width="2"/>
      <circle cx="154" cy="470" r="18" fill="#e0f2fe"/>
      <text x="154" y="477" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="800" fill="#0369a1" text-anchor="middle">平</text>
      <text x="184" y="468" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="800" fill="#172033" text-anchor="start">平台运维</text>
      <text x="142" y="502" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="500" fill="#667085" text-anchor="start">平台方运维，跨商户</text>
      <text x="142" y="522" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="500" fill="#667085" text-anchor="start">查看设备与故障</text>
      <text x="142" y="562" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="700" fill="#0369a1" text-anchor="start">数据范围：全平台</text>
    </g>
    <g>
      <rect x="368" y="436" width="222" height="150" rx="14" fill="#ffffff" stroke="#d7e2ee" stroke-width="2"/>
      <circle cx="400" cy="470" r="18" fill="#f3e8ff"/>
      <text x="400" y="477" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="800" fill="#7e22ce" text-anchor="middle">商</text>
      <text x="430" y="468" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="800" fill="#172033" text-anchor="start">商户管理员</text>
      <text x="388" y="502" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="500" fill="#667085" text-anchor="start">管理本商户的运营、</text>
      <text x="388" y="522" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="500" fill="#667085" text-anchor="start">设备与人员</text>
      <text x="388" y="562" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="700" fill="#7e22ce" text-anchor="start">数据范围：本商户</text>
    </g>
    <g>
      <rect x="614" y="436" width="222" height="150" rx="14" fill="#ffffff" stroke="#d7e2ee" stroke-width="2"/>
      <circle cx="646" cy="470" r="18" fill="#dcfce7"/>
      <text x="646" y="477" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="800" fill="#15803d" text-anchor="middle">店</text>
      <text x="676" y="468" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="800" fill="#172033" text-anchor="start">店长</text>
      <text x="634" y="502" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="500" fill="#667085" text-anchor="start">负责门店日常运营</text>
      <text x="634" y="522" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="500" fill="#667085" text-anchor="start">管理</text>
      <text x="634" y="562" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="700" fill="#15803d" text-anchor="start">数据范围：本商户</text>
    </g>
    <g>
      <rect x="860" y="436" width="222" height="150" rx="14" fill="#ffffff" stroke="#d7e2ee" stroke-width="2"/>
      <circle cx="892" cy="470" r="18" fill="#dbeafe"/>
      <text x="892" y="477" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="800" fill="#1d4ed8" text-anchor="middle">维</text>
      <text x="922" y="468" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="800" fill="#172033" text-anchor="start">运维人员</text>
      <text x="880" y="502" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="500" fill="#667085" text-anchor="start">负责设备安装、维护</text>
      <text x="880" y="522" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="500" fill="#667085" text-anchor="start">与故障处理</text>
      <text x="880" y="562" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="start">数据范围：指定设备</text>
    </g>
    <g>
      <rect x="1106" y="436" width="212" height="150" rx="14" fill="#ffffff" stroke="#d7e2ee" stroke-width="2"/>
      <circle cx="1138" cy="470" r="18" fill="#fef3c7"/>
      <text x="1138" y="477" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="800" fill="#92400e" text-anchor="middle">职</text>
      <text x="1168" y="468" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="800" fill="#172033" text-anchor="start">职员</text>
      <text x="1126" y="502" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="500" fill="#667085" text-anchor="start">基础查看权限，可根</text>
      <text x="1126" y="522" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="500" fill="#667085" text-anchor="start">据需要添加</text>
      <text x="1126" y="562" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400e" text-anchor="start">数据范围：指定设备</text>
    </g>

    <rect x="122" y="616" width="1196" height="60" rx="14" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="154" y="652" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f766e" text-anchor="start">「超级管理员」不出现在可选角色中——该角色只能通过外部途径开通，不会在此新增。</text>

    <line x1="122" y1="712" x2="1318" y2="712" stroke="#d7e2ee"/>
    <rect x="1120" y="892" width="128" height="42" rx="8" fill="#109c93"/>
    <text x="1184" y="919" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">下一步</text>
    <rect x="980" y="892" width="120" height="42" rx="8" fill="#fff" stroke="#d7e2ee"/>
    <text x="1040" y="919" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="800" fill="#475467" text-anchor="middle">取消</text>
</svg>
