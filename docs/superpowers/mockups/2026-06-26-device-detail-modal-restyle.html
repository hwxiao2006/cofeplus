<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设备详情 · 改版预览</title>
<style>
  :root{
    --primary:#4ECDC4; --primary-dark:#3dbdb4; --primary-soft:#e8faf8;
    --text-primary:#2d3436; --text-secondary:#636e72; --text-faint:#9aa3a8;
    --bg-page:#eef2f6; --bg-card:#fff; --border:#e9ecef; --line:#f1f3f5;
    --danger:#ff6b6b; --danger-soft:#ffecec; --success:#2ed573; --success-soft:#e7faec;
    --radius:14px; --radius-sm:9px;
    --shadow:0 24px 60px rgba(45,52,54,.18);
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:-apple-system,"system-ui","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; background:var(--bg-page); color:var(--text-primary); -webkit-font-smoothing:antialiased; min-height:100vh; display:grid; place-items:center; padding:24px; }

  .modal{ width:100%; max-width:1040px; background:var(--bg-card); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }

  /* 顶部标题条 */
  .modal-top{ display:flex; align-items:center; justify-content:space-between; padding:16px 22px; border-bottom:1px solid var(--border); }
  .modal-top h3{ margin:0; font-size:17px; font-weight:700; }
  .x{ width:32px; height:32px; border-radius:9px; border:1px solid var(--border); background:#fff; color:var(--text-secondary); cursor:pointer; font-size:16px; }

  /* 设备头部 */
  .dev-head{ display:flex; align-items:center; gap:14px; padding:18px 22px 0; }
  .back{ width:30px; height:30px; border-radius:8px; border:1px solid var(--border); background:#fff; color:var(--text-secondary); cursor:pointer; font-size:16px; flex:0 0 auto; }
  .dev-id{ font-size:20px; font-weight:750; letter-spacing:.2px; }
  .loc{ font-size:13px; color:var(--text-secondary); }
  .pill{ display:inline-flex; align-items:center; gap:6px; height:25px; padding:0 11px; border-radius:999px; font-size:12.5px; font-weight:600; }
  .pill .dot{ width:7px; height:7px; border-radius:50%; }
  .pill-run{ background:var(--success-soft); color:#1aa251; } .pill-run .dot{ background:var(--success); }
  .pill-entered{ background:var(--primary-soft); color:var(--primary-dark); }
  .head-actions{ margin-left:auto; display:flex; align-items:center; gap:10px; }
  .btn{ height:38px; padding:0 16px; border-radius:10px; font-size:13.5px; font-weight:600; cursor:pointer; border:1px solid var(--border); background:#fff; color:var(--text-primary); font-family:inherit; display:inline-flex; align-items:center; gap:6px; }
  .btn-primary{ background:var(--primary); border-color:var(--primary); color:#fff; box-shadow:0 6px 14px rgba(78,205,196,.3); }
  .btn-soft{ background:var(--primary-soft); border-color:transparent; color:var(--primary-dark); }
  .btn-icon{ width:38px; padding:0; justify-content:center; color:var(--text-secondary); font-weight:700; }
  .split{ display:inline-flex; }
  .split .btn-primary{ border-top-right-radius:0; border-bottom-right-radius:0; padding-right:12px; }
  .split .caret{ height:38px; width:30px; border-radius:0 10px 10px 0; border:1px solid var(--primary); border-left:1px solid rgba(255,255,255,.4); background:var(--primary); color:#fff; cursor:pointer; }

  /* tabs */
  .tabs{ display:flex; gap:6px; padding:14px 22px 0; border-bottom:1px solid var(--border); }
  .tab{ padding:9px 14px; font-size:14px; font-weight:600; color:var(--text-secondary); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab.active{ color:var(--primary-dark); border-bottom-color:var(--primary); }

  /* body */
  .body{ padding:18px 22px 6px; max-height:60vh; overflow:auto; }
  .card{ border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:14px; }
  .card-title{ display:flex; align-items:center; gap:9px; font-size:14.5px; font-weight:700; margin-bottom:12px; }
  .card-title::before{ content:""; width:4px; height:14px; border-radius:2px; background:var(--primary); }
  .kv-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 32px; }
  @media(max-width:640px){ .kv-grid{ grid-template-columns:1fr; } }
  .kv{ display:flex; flex-direction:column; gap:3px; padding:11px 0; border-bottom:1px solid var(--line); }
  .kv.full{ grid-column:1 / -1; }
  .kv .k{ font-size:12px; color:var(--text-faint); }
  .kv .v{ font-size:14px; font-weight:600; color:var(--text-primary); }
  .kv .v.ok{ color:#1aa251; }

  /* footer */
  .footer{ display:flex; justify-content:flex-end; gap:10px; padding:14px 22px; border-top:1px solid var(--border); }
  .btn-ghost{ background:#fff; }
</style>
</head>
<body>
  <div class="modal">
    <div class="modal-top">
      <h3>设备详情</h3>
      <button class="x">×</button>
    </div>

    <div class="dev-head">
      <button class="back">‹</button>
      <span class="dev-id">RCK386</span>
      <span class="pill pill-run"><span class="dot"></span>运行中</span>
      <span class="pill pill-entered">已入场</span>
      <span class="loc">上海市中心店</span>
      <div class="head-actions">
        <span class="split"><button class="btn btn-primary">↻ 重启</button><button class="caret">▾</button></span>
        <button class="btn btn-soft">远程操作</button>
        <button class="btn btn-icon">⋯</button>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active">概览</div>
      <div class="tab">运行</div>
      <div class="tab">记录</div>
      <div class="tab">入场</div>
      <div class="tab">广告屏</div>
    </div>

    <div class="body">
      <div class="card">
        <div class="card-title">设备概览</div>
        <div class="kv-grid">
          <div class="kv"><span class="k">设备编号</span><span class="v">RCK386</span></div>
          <div class="kv"><span class="k">设备类别</span><span class="v">自营</span></div>
          <div class="kv full"><span class="k">点位</span><span class="v">上海市中心店</span></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">设备状态</div>
        <div class="kv-grid">
          <div class="kv"><span class="k">设备状态</span><span class="v ok">运行中</span></div>
          <div class="kv"><span class="k">停卖状态</span><span class="v">否</span></div>
          <div class="kv"><span class="k">最近心跳</span><span class="v">2026-02-11 15:06</span></div>
          <div class="kv"><span class="k">入场状态</span><span class="v">已入场</span></div>
          <div class="kv full"><span class="k">当前异常摘要</span><span class="v">当前无异常</span></div>
        </div>
      </div>
    </div>

    <div class="footer">
      <button class="btn btn-ghost">关闭</button>
      <button class="btn btn-primary">编辑入场信息</button>
    </div>
  </div>
</body>
</html>
